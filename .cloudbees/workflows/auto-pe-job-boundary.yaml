apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: auto-pe-job-boundary
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
on:
  workflow_dispatch: {}
jobs:
  scan-job:
    steps:
      - name: Run step
        uses: docker://alpine:3.18
        run: echo "scan-job running"
  independent-scan-job:
    needs:
      - scan-job
    steps:
      - name: Run step
        uses: docker://alpine:3.18
        run: echo "independent-job running"
  post-scan-job:
    needs:
      - independent-scan-job
    steps:
      - name: Run step
        uses: docker://alpine:3.18
        run: echo "post-scan-job running"

  independent-job:
    steps:
      - name: Run step
        uses: docker://alpine:3.18
        run: echo "independent-job running"
